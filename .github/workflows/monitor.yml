name: Eneba PSN Monitor

on:
  workflow_dispatch:
    inputs:
      chained:
        description: "Avviato automaticamente dal run precedente (lascia vuoto)"
        type: boolean
        default: false

  # Il ciclo si riavvia da solo a fine run (step "Restart loop").
  # Questo cron è solo una rete di sicurezza per farlo ripartire se si interrompe.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: eneba-monitor
  cancel-in-progress: false

env:
  MIN_DISCOUNT: "20"     # sconto minimo (%) rispetto al taglio per ricevere l'avviso
  LOOP_MINUTES: "340"    # repo pubblico: controlla per ~5h40 e poi si riavvia da solo
  CHECK_INTERVAL: "60"   # secondi tra un controllo e l'altro quando RUN_MINUTES > 0
  PRICE_FACTOR: "1.055"  # dai server GitHub (USA) Eneba mostra prezzi ~5,5% più alti che dall'Italia

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Con repo privato i minuti gratis sono 2.000/mese: il ciclo continuo li finirebbe
      # in un paio di giorni. Quindi il ciclo parte solo se il repo è pubblico.
      - name: Choose mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "false" ]; then
            echo "run_minutes=${LOOP_MINUTES}" >> "$GITHUB_OUTPUT"
            echo "Repo pubblico: ciclo continuo."
          else
            echo "run_minutes=0" >> "$GITHUB_OUTPUT"
            echo "Repo privato: un solo controllo."
          fi

      - name: Run monitor
        env:
          RUN_MINUTES: ${{ steps.mode.outputs.run_minutes }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.chained }}
        run: python monitor.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Eneba PSN Monitor"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Eneba state"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Restart loop
        if: ${{ !cancelled() && steps.mode.outputs.run_minutes != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${GITHUB_REF_NAME}" -f chained=true
